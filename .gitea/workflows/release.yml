name: release

# ROLLING release on the canonical hive build, the same as the other gitea hive
# packages: every push to main that changes the library publishes the next
# patch, version = 0.{version.edn :minor}.{git-count-revs} (hive-build's
# no-VERSION-file mode; no bump commit, no tag). Dropping a tracked ./VERSION
# back in would switch to pinned, bump-driven versions with the same build.
#
# Path-filtered to library sources, plus this workflow so a pipeline change is
# exercised by the push that makes it.
#
# Secrets: MAVEN_USERNAME, MAVEN_TOKEN, MAVEN_URL (org-wide on hive-agi).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - '.gitea/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
      MAVEN_URL: ${{ secrets.MAVEN_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
          clojure --version

      - name: Materialize private-registry resolution credentials
        if: env.MAVEN_TOKEN != ''
        run: |
          CLJ_CONFIG="${CLJ_CONFIG:-${XDG_CONFIG_HOME:+$XDG_CONFIG_HOME/clojure}}"
          CLJ_CONFIG="${CLJ_CONFIG:-$HOME/.clojure}"
          mkdir -p "$CLJ_CONFIG" "$HOME/.m2"
          cat > "$CLJ_CONFIG/deps.edn" <<'EOF'
          {:mvn/repos {"hive-gitea" {:url "https://gitea.hive-mcp.com/api/packages/hive-agi/maven"}}}
          EOF
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>hive-gitea</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Test suite
        if: env.MAVEN_TOKEN != ''
        run: clojure -M:test

      # Rolling: `deploy` reads version.edn :publish (:gitea) and publishes
      # 0.{minor}.{git-count}. Idempotent: a re-run at the same HEAD skips.
      - name: Deploy (rolling patch = git-count)
        if: env.MAVEN_TOKEN != ''
        run: clojure -T:build deploy
